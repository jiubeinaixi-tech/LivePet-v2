<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    #pet-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
    }
    #pet {
        width: 100%;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-select: none;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id="pet-wrap">
    <img id="pet" src="pet.png" />
</div>
</body>
</html>
